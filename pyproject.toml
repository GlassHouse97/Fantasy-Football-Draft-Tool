[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fantasy-football-draft-ai"
version = "0.1.0"
description = "A local-first, ruleset-aware fantasy football draft assistant and ML learning project."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Chris Delgado" }]
dependencies = [
  "duckdb>=1.4,<2",
  "httpx>=0.28,<1",
  "nflreadpy>=0.1.5,<1",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "streamlit>=1.61,<2",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
modeling = [
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<1",
]
notebooks = ["jupyterlab>=4.3,<5"]
explain = ["shap>=0.46,<1"]
dev = [
  "mypy>=1.14,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
fantasy-draft = "fantasy_draft_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_draft_ai"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.pytest_tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["fantasy_draft_ai"]
warn_unused_ignores = true
